name: Daily Changelog

on:
  # 10:00 UTC == 18:00 SGT (UTC+8). GitHub cron is always in UTC.
  schedule:
    - cron: '0 10 * * *'
  # allow running it on demand from the Actions tab
  workflow_dispatch:

# the job pushes a commit back, so it needs write access to repo contents
permissions:
  contents: write

# don't let a manual run and the scheduled run collide
concurrency:
  group: daily-changelog
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (full history)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # need full history for `git log --since`

      - name: Generate the last-24h section
        run: |
          set -euo pipefail
          DATE="$(date -u +'%Y-%m-%d')"

          # Commits in the last 24h, excluding this workflow's own changelog commits
          COMMITS="$(git log --since='24 hours ago' --no-merges \
            -i --invert-grep --grep='update daily changelog' \
            --pretty=format:'- %s (`%h`) — %an' || true)"

          {
            echo "## ${DATE} (last 24h)"
            echo ""
            if [ -z "${COMMITS}" ]; then
              echo "_No commits in the last 24 hours._"
            else
              echo "${COMMITS}"
            fi
            echo ""
          } > section.md

          # Prepend the new section under the title, keeping previous days below
          if [ -f DAILY_CHANGELOG.md ]; then
            cp DAILY_CHANGELOG.md old.md
          else
            printf '# Daily Changelog\n\n' > old.md
          fi
          {
            head -n 2 old.md      # "# Daily Changelog" + blank line
            cat section.md
            tail -n +3 old.md     # everything below the title (older sections)
          } > DAILY_CHANGELOG.md
          rm -f section.md old.md

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add DAILY_CHANGELOG.md
          if git diff --staged --quiet; then
            echo "No changelog changes to commit."
          else
            # [skip ci] tells Vercel (and push-triggered CI) NOT to deploy/build this
            # docs-only commit — the commit still lands on main as normal.
            git commit -m "docs: update daily changelog [skip ci]"
            git push origin main
          fi
