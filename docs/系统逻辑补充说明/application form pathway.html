<!doctype html>
<html lang="en" data-zone="enterprise" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Application form pathway</title>
<style>
:root { color-scheme: light; background: Canvas; }
html, body { margin: 0; }
body { box-sizing: border-box; padding: 16px; background: Canvas; }
</style>
</head>
<body>
<!-- The review fields live in the top document so browser comments can target them. -->
<div id="dsta-education-demo" data-zone="enterprise" data-mode="light" aria-label="Transcript fields by pathway">
<style>
#dsta-education-demo{--dsta-bg:#f6f8fb;--dsta-surface:#fff;--dsta-fg:#172a42;--dsta-muted:#53657b;--dsta-border:#d5dee9;--dsta-accent:#00328a;--dsta-soft:#eef5ff;--dsta-gap:20px;color-scheme:light;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--dsta-fg);width:100%;max-width:736px;margin:auto;background:var(--dsta-bg);border:1px solid var(--dsta-border);border-radius:12px}
#dsta-education-demo *{box-sizing:border-box}
#dsta-education-demo header{padding:24px;background:var(--dsta-surface);border-radius:12px 12px 0 0;border-bottom:1px solid var(--dsta-border)}
#dsta-education-demo h2{font-size:22px;line-height:1.3;font-weight:500;margin:0 0 22px}
#dsta-education-demo h3{font-size:17px;font-weight:500;margin:0}
#dsta-education-demo h4{font-size:14px;font-weight:500;margin:0 0 14px;color:var(--dsta-fg)}
#dsta-education-demo .dsta-controls{display:grid;grid-template-columns:1fr 1fr;gap:20px}
#dsta-education-demo .dsta-field{min-width:0;display:flex;flex-direction:column;gap:7px;overflow-wrap:anywhere}
#dsta-education-demo .dsta-field[hidden]{display:none}
#dsta-education-demo .dsta-field-label{font-weight:500;font-size:13px;color:var(--dsta-muted)}
#dsta-education-demo .dsta-mode{display:flex;gap:6px;flex-wrap:wrap}
#dsta-education-demo button{font:inherit;font-weight:500;border:1px solid var(--dsta-border);border-radius:6px;background:var(--dsta-surface);color:var(--dsta-fg);min-height:44px;padding:10px 12px;cursor:pointer;max-width:100%;white-space:normal}
#dsta-education-demo button:hover{background:var(--dsta-soft)}
#dsta-education-demo button[aria-pressed=true]{color:var(--dsta-accent);background:var(--dsta-soft);border-color:var(--dsta-accent)}
#dsta-education-demo input,#dsta-education-demo textarea,#dsta-education-demo select{font:inherit;color:var(--dsta-fg);background:var(--dsta-surface);border:1px solid var(--dsta-border);border-radius:5px;padding:10px;min-height:44px;width:100%;min-width:0;max-width:100%}
#dsta-education-demo textarea{min-height:74px;resize:vertical}
#dsta-education-demo .dsta-body{display:grid;gap:16px;padding:16px}
#dsta-education-demo .dsta-section{padding:var(--dsta-gap);background:var(--dsta-surface);border:1px solid var(--dsta-border);border-radius:8px;min-width:0}
#dsta-education-demo .dsta-section-heading{margin-bottom:20px}
#dsta-education-demo .dsta-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 22px;min-width:0}
#dsta-education-demo .dsta-full{grid-column:1/-1}
#dsta-education-demo output{display:block;min-height:32px;padding:1px 0 10px;border-bottom:1px solid var(--dsta-border);white-space:pre-wrap;font-size:15px;overflow-wrap:anywhere}
#dsta-education-demo output[data-empty=true]{color:var(--dsta-muted)}
#dsta-education-demo .dsta-group{min-width:0;margin-top:24px;padding-top:20px;border-top:1px solid var(--dsta-border)}
#dsta-education-demo .dsta-group:first-child{margin-top:0;padding-top:0;border-top:0}
#dsta-education-demo .dsta-record{min-width:0;padding:18px 0;border-top:1px solid var(--dsta-border)}
#dsta-education-demo .dsta-record:first-of-type{padding-top:0;border-top:0}
#dsta-education-demo .dsta-record-heading{font-size:12px;color:var(--dsta-muted);margin-bottom:14px}
#dsta-education-demo details{min-width:0;border-top:1px solid var(--dsta-border);margin-top:22px;padding-top:5px}
#dsta-education-demo summary{font-weight:500;color:var(--dsta-accent);cursor:pointer;min-height:44px;padding:12px 0;overflow-wrap:anywhere}
#dsta-education-demo .dsta-live{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:560px){#dsta-education-demo header{padding:20px 16px}#dsta-education-demo .dsta-controls,#dsta-education-demo .dsta-grid{grid-template-columns:1fr}#dsta-education-demo .dsta-body{padding:10px}#dsta-education-demo .dsta-section{padding:16px}#dsta-education-demo input,#dsta-education-demo select,#dsta-education-demo textarea{font-size:16px}}
</style>
<header>
  <h2>Transcript fields</h2>
  <div class="dsta-controls">
    <div class="dsta-field"><span class="dsta-field-label" id="dsta-view-label">View mode</span><div class="dsta-mode" role="group" aria-labelledby="dsta-view-label"><button type="button" data-view="scanned" aria-pressed="true">Scanned result</button><button type="button" data-view="manual" aria-pressed="false">Manual entry</button></div></div>
    <div class="dsta-field"><label class="dsta-field-label" for="dsta-pathway">Pathway</label><select id="dsta-pathway"></select></div>
  </div>
</header>
<div class="dsta-body">
  <section class="dsta-section" aria-labelledby="dsta-transcript-title"><div class="dsta-section-heading"><h3 id="dsta-transcript-title">Transcript details</h3></div><div id="dsta-transcript-fields"></div></section>

</div>

<script>
(()=>{
  const root=document.getElementById('dsta-education-demo');
  const get=id=>root.querySelector('#'+id);
  const profiles=JSON.parse(get('dsta-profile-schema').textContent).profiles;
  const examples=JSON.parse(get('dsta-scan-samples').textContent).profiles;
  const labels={university:'University',polytechnic:'Polytechnic',jc:'JC internal / preliminary',alevel:'Official Singapore A-Level',olevel:'Singapore O-Level',ip:'Integrated Programme (IP)',ib_official:'IB official results',ib_school:'IB school / predicted',nush:'NUS High',other:'Other / US curriculum'};
  const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const clone=value=>JSON.parse(JSON.stringify(value));
  const F=(key,label,type='text',options)=>({key,label,type,options});
  const availability=['Reported','Not reported','Not yet released','Not applicable','Unknown'];
  const documentTypes=['Official transcript','Unofficial transcript','Academic transcript — status not stated','School report','Result slip','Examination certificate','Diploma supplement','Other'];
  const basicFields=[F('institution','Institution'),F('qualification','Qualification'),F('documentType','Document type','select',documentTypes),F('resultType','Result / assessment type','select'),F('resultAvailability','Result availability','select',availability)];
  // Preserve transcript metadata in records while keeping the applicant-facing fields concise.
  const hiddenTranscriptFields=new Set(['documentType','resultAvailability']);
  const hiddenOverallFields=new Set(['gradingSystemStatus','gradingNotes']);
  // These pathways need assessment context beyond the pathway name and GPA/CAP scope.
  const assessmentTypePathways=new Set(['jc','olevel','ip','ib_school','other']);
  const mainTranscript=[F('printedCourse','Course / diploma as printed'),F('printedYear','Current year')];
  const extraTranscript=[F('period','Academic period / examination session'),F('issueDate','Document issue date'),F('awardOutcome','Award outcome as printed')];
  const state={pathway:'university',view:'scanned',drafts:{},openDetails:{}};
  const design={compact:false};
  function blankRecord(key){const p=profiles[key],s=examples[key];return {transcript:Object.fromEntries([...basicFields,...mainTranscript,...extraTranscript].map(f=>[f.key,''])),values:Object.fromEntries([...p.coreFields,...p.extraFields].filter(f=>f.key!=='awardOutcome').map(f=>[f.key,''])),repeaters:Object.fromEntries(p.repeaters.map(rep=>[rep.key,Array.from({length:Math.max(1,s.repeaters?.[rep.key]?.length||0)},()=>Object.fromEntries(rep.fields.map(f=>[f.key,''])))]))};}
  function manualRecord(){return state.drafts[state.pathway]||(state.drafts[state.pathway]=blankRecord(state.pathway));}
  function activeRecord(){return state.view==='scanned'?examples[state.pathway]:manualRecord();}
  function options(list,value){return '<option value=""></option>'+list.map(option=>'<option value="'+esc(option)+'"'+(option===value?' selected':'')+'>'+esc(option)+'</option>').join('');}
  function renderField(f,value,scope,rep='',index=''){
    const id='dsta-field-'+scope+'-'+rep+'-'+index+'-'+f.key;
    const attributes=' id="'+id+'" data-scope="'+scope+'" data-key="'+f.key+'"'+(rep?' data-repeater="'+rep+'" data-row="'+index+'"':'');
    const text=value??'';
    let control;
    if(state.view==='scanned')control='<output'+attributes+' data-empty="'+(text==='')+'">'+esc(text===''?'—':text)+'</output>';
    else if(f.type==='select'&&(f.options||[]).length>1)control='<select'+attributes+'>'+options(f.options,text)+'</select>';
    else if(f.type==='textarea')control='<textarea'+attributes+'>'+esc(text)+'</textarea>';
    else control='<input'+attributes+' type="text" value="'+esc(text)+'" autocomplete="off">';
    return '<div class="dsta-field'+(f.type==='textarea'?' dsta-full':'')+'" data-field-key="'+scope+'.'+(rep?rep+'.'+f.key:f.key)+'"><label class="dsta-field-label" for="'+id+'">'+esc(f.label)+'</label>'+control+'</div>';
  }
  const fieldGrid=(fields,values,scope,rep='',index='')=>'<div class="dsta-grid">'+fields.map(f=>renderField(f,values[f.key],scope,rep,index)).join('')+'</div>';
  function updateOverallAvailability(){
    const field=root.querySelector('[data-field-key="values.metricAvailability"]');
    if(!field)return;
    const values=activeRecord().values;
    const hasResult=String(values.metricValue??'').trim()!=='';
    // Keep explicit missing/conflicting states visible; a numeric zero is still a result.
    field.hidden=hasResult&&['','Reported'].includes(values.metricAvailability??'');
  }
  function render(){
    const p=profiles[state.pathway],record=activeRecord();
    root.dataset.pathway=state.pathway;root.dataset.view=state.view;
    get('dsta-pathway').value=state.pathway;
    root.querySelectorAll('[data-view]').forEach(button=>{if(button.tagName==='BUTTON')button.setAttribute('aria-pressed',String(button.dataset.view===state.view));});
    const basics=basicFields.filter(f=>!hiddenTranscriptFields.has(f.key)&&(f.key!=='resultType'||assessmentTypePathways.has(state.pathway))).map(f=>f.key==='resultType'?{...f,options:p.resultTypes}:f).flatMap(f=>f.key==='qualification'?[f,...mainTranscript]:[f]);
    const transcriptGrid='<div class="dsta-grid">'+basics.map(f=>{
      // IP keeps its existing year data binding while moving the field into the transcript summary.
      if(state.pathway==='ip'&&f.key==='printedYear')return renderField(F('reportedSchoolYear','Current year'),record.values.reportedSchoolYear,'values');
      return renderField(f,record.transcript[f.key],'transcript');
    }).join('')+'</div>';
    get('dsta-transcript-fields').innerHTML=transcriptGrid+'<details data-detail="transcript"'+(state.openDetails[state.pathway]?.transcript?' open':'')+'><summary>Additional transcript details</summary>'+fieldGrid(extraTranscript.filter(f=>!(state.pathway==='ib_official'&&f.key==='awardOutcome')),record.transcript,'transcript')+'</details>';
    let content='';
    const coreFields=p.coreFields.filter(f=>!hiddenOverallFields.has(f.key)&&!(state.pathway==='ip'&&f.key==='reportedSchoolYear'));
    if(coreFields.length)content+='<div class="dsta-group" data-field-group="overall"><h4>Overall results</h4>'+fieldGrid(coreFields,record.values,'values')+'</div>';
    for(const rep of p.repeaters){
      const rows=record.repeaters[rep.key];
      const fields=rep.key==='overallCaps'?rep.fields.filter(f=>!hiddenOverallFields.has(f.key)):rep.fields;
      content+='<div class="dsta-group" data-field-group="'+rep.key+'"><h4>'+esc(rep.label)+'</h4>'+rows.map((row,index)=>'<div class="dsta-record" data-record="'+rep.key+'-'+index+'">'+(rows.length>1?'<div class="dsta-record-heading">'+esc(rep.label)+' '+(index+1)+'</div>':'')+fieldGrid(fields,row,'repeaters',rep.key,index)+'</div>').join('')+'</div>';
    }
    const additional=p.extraFields.filter(f=>f.key!=='awardOutcome');
    if(additional.length||state.pathway==='ib_official')content+='<div class="dsta-group" data-field-group="additional"><h4>'+(state.pathway.startsWith('ib_')?'IB core &amp; award':'Additional results')+'</h4>'+fieldGrid(additional,record.values,'values')+(state.pathway==='ib_official'?fieldGrid([F('awardOutcome','Diploma / award outcome')],record.transcript,'transcript'):'')+'</div>';
    get('dsta-academic-fields').innerHTML=content;
    updateOverallAvailability();
    get('dsta-view-status').textContent=labels[state.pathway]+' · '+(state.view==='scanned'?'Scanned result':'Manual entry');
  }
  function storeInput(el){if(state.view!=='manual'||!root.contains(el)||!el.dataset.key)return;const d=manualRecord(),scope=el.dataset.scope;const target=scope==='repeaters'?d.repeaters[el.dataset.repeater][Number(el.dataset.row)]:d[scope];target[el.dataset.key]=el.value;updateOverallAvailability();}
  root.addEventListener('input',event=>{if(event.target.tagName!=='SELECT')storeInput(event.target);});
  root.addEventListener('change',event=>{const el=event.target;if(!root.contains(el))return;if(el.id==='dsta-pathway'){state.pathway=el.value;render();return;}if(el.tagName==='SELECT')storeInput(el);});
  root.addEventListener('click',event=>{const button=event.target.closest('button[data-view]');if(!button||!root.contains(button))return;state.view=button.dataset.view;render();});
  root.addEventListener('toggle',event=>{if(!root.contains(event.target)||!event.target.dataset.detail)return;const open=state.openDetails[state.pathway]||(state.openDetails[state.pathway]={});open[event.target.dataset.detail]=event.target.open;},true);
  get('dsta-pathway').innerHTML=Object.entries(labels).map(([key,label])=>'<option value="'+key+'">'+esc(label)+'</option>').join('');
  root.getExplorerState=()=>clone({pathway:state.pathway,view:state.view,record:activeRecord(),manualDrafts:state.drafts});
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>root.style.setProperty('--dsta-gap',design.compact?'14px':'20px')});tweak.addToggle(design,'compact',{label:'Compact spacing'});}
})();
</script>
