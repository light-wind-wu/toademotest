<!doctype html>
<html lang="en-SG">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Prototype updates with UX feedback · Lifecycle</title>
  <style>
    :root {
      --blue: #5e9eff;
      --amber: #ffc266;
      --amber-soft: #ffd591;
      --ink: #f5f5f7;
      --ink-soft: #aeaeb4;
      --bg: #000;
      --card: rgba(255,255,255,.055);
      --line: rgba(255,255,255,.12);
      --radius: 26px;
      --ease: cubic-bezier(.2,.8,.2,1);
      --font: -apple-system, "SF Pro Display", "SF Pro Text", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    html, body { min-height: 100%; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    body {
      min-height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      color-scheme: dark;
    }

    .wash { position: fixed; inset: -25%; opacity: .85; filter: blur(80px); pointer-events: none; }
    .blob { position: absolute; border-radius: 50%; mix-blend-mode: screen; animation: drift 26s var(--ease) infinite alternate; }
    .b1 { left: -6vw; top: -10vw; width: 48vw; height: 48vw; background: radial-gradient(circle at 30% 30%, rgba(46,86,196,.55), transparent 70%); }
    .b2 { right: -10vw; top: 2vw; width: 44vw; height: 44vw; background: radial-gradient(circle at 60% 40%, rgba(245,166,35,.32), transparent 70%); animation-delay: -8s; }
    .b3 { left: 16vw; bottom: -20vw; width: 54vw; height: 54vw; background: radial-gradient(circle at 50% 50%, rgba(60,110,230,.4), transparent 70%); animation-delay: -15s; }
    @keyframes drift { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(4vw,3vh,0) scale(1.12); } }

    .stage {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(24px,6vw,92px);
      text-align: center;
      transition: opacity .45s var(--ease), transform .5s var(--ease), filter .45s var(--ease);
    }
    body.detail-open .stage { opacity: .2; transform: scale(.97); filter: blur(6px); pointer-events: none; }

    .num {
      border: 1px solid rgba(245,166,35,.3);
      background: rgba(245,166,35,.12);
      color: var(--amber);
      border-radius: 999px;
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin-top: 28px;
      font-size: clamp(34px,5.4vw,72px);
      line-height: 1.04;
      font-weight: 700;
      letter-spacing: -.022em;
    }
    .grad {
      background: linear-gradient(110deg, var(--amber), var(--amber-soft));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .lead {
      margin-top: 24px;
      max-width: 54ch;
      color: var(--ink-soft);
      font-size: clamp(15px,1.8vw,20px);
      line-height: 1.45;
    }

    .flowcols {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(14px,1.8vw,22px);
      margin-top: 40px;
      width: min(1080px, 95vw);
      text-align: left;
    }
    .glass {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 24px 70px -34px rgba(0,0,0,.85);
    }
    .fcol { padding: 24px 22px; }
    .fst {
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
      font-size: clamp(16px,1.8vw,21px);
      font-weight: 700;
      letter-spacing: -.01em;
    }
    .fareas { display: flex; flex-direction: column; gap: 11px; margin-top: 16px; }
    .farea {
      min-height: 58px;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 16px;
      border: 1px solid rgba(255,194,102,.26);
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(245,166,35,.12), rgba(245,166,35,.035));
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      text-align: left;
      transition: .3s var(--ease);
    }
    .farea:hover, .farea:focus-visible {
      outline: none;
      border-color: rgba(255,194,102,.6);
      background: linear-gradient(135deg, rgba(245,166,35,.22), rgba(245,166,35,.07));
      transform: translateY(-2px);
      box-shadow: 0 16px 34px -22px rgba(245,166,35,.7);
    }
    .fic {
      flex: none;
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: rgba(245,166,35,.16);
      color: var(--amber);
    }
    .fic svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .fic.fcode { font-weight: 800; font-size: 13px; letter-spacing: .5px; }
    .fan {
      min-width: 0;
      flex: 1;
      color: var(--ink);
      font-size: clamp(14px,1.5vw,16.5px);
      font-weight: 650;
      letter-spacing: -.01em;
    }
    .chev {
      flex: none;
      width: 7px;
      height: 7px;
      border-right: 2px solid var(--amber);
      border-top: 2px solid var(--amber);
      transform: rotate(45deg);
      opacity: .6;
      transition: .3s var(--ease);
    }
    .farea:hover .chev, .farea:focus-visible .chev { opacity: 1; transform: rotate(45deg) translate(2px,-2px); }

    .detail {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      opacity: 0;
      transform: scale(.96);
      pointer-events: none;
      transition: opacity .5s var(--ease), transform .55s var(--ease);
    }
    body.detail-open .detail { opacity: 1; transform: none; pointer-events: auto; }
    .detail-stack {
      width: 100%;
      height: calc(100dvh - 36px);
      max-width: none;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }
    .detail-grid {
      width: 100%;
      min-height: 0;
      flex: 1;
      display: grid;
      grid-template-columns: minmax(300px, 30%) minmax(0, 1fr);
      gap: 0;
      align-items: stretch;
      overflow: hidden;
      border-radius: var(--radius);
    }
    .detail-card {
      max-height: none;
      overflow: auto;
      padding: clamp(22px,3vw,34px);
      text-align: left;
      border-radius: var(--radius) 0 0 var(--radius);
      border-right: 0;
    }
    .detail-aside {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      align-content: stretch;
      gap: 14px;
      min-height: 0;
      min-width: 0;
      max-height: 100%;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: clamp(18px,2.4vw,28px);
      text-align: left;
      background: linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.025));
      border-radius: 0 var(--radius) var(--radius) 0;
    }
    .phase {
      color: var(--amber);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    .detail h2 {
      margin-top: 16px;
      color: var(--ink);
      font-size: clamp(27px,4vw,44px);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -.02em;
    }
    .detail-title-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .detail-tabs {
      display: flex;
      gap: 8px;
      margin-top: 18px;
      flex-wrap: wrap;
    }
    .detail-tabs[hidden] { display: none; }
    .tab-btn {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.045);
      color: var(--ink-soft);
      padding: 0 13px;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: .22s var(--ease);
    }
    .tab-btn:hover, .tab-btn:focus-visible {
      outline: none;
      border-color: rgba(255,194,102,.48);
      color: var(--ink);
    }
    .tab-btn.active {
      border-color: rgba(255,194,102,.68);
      background: rgba(245,166,35,.14);
      color: var(--amber);
    }
    .flow-list { margin-top: 28px; list-style: none; }
    .flow-list li {
      position: relative;
      display: flex;
      gap: 16px;
      padding-bottom: 20px;
      color: var(--ink);
      font-size: clamp(14px,1.6vw,17px);
      line-height: 1.45;
    }
    .flow-list li:last-child { padding-bottom: 0; }
    .flow-list li:not(:last-child)::before {
      content: "";
      position: absolute;
      left: 15px;
      top: 31px;
      bottom: -1px;
      width: 2px;
      background: linear-gradient(180deg, rgba(245,166,35,.55), rgba(245,166,35,.12));
      transform: translateX(-50%);
    }
    .kn {
      position: relative;
      z-index: 1;
      flex: none;
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      color: #2a1800;
      background: linear-gradient(135deg, var(--amber-soft), var(--amber));
      box-shadow: 0 4px 12px -4px rgba(245,166,35,.7);
      font-size: 13px;
      font-weight: 700;
    }
    .kt { padding-top: 5px; }

    .flow-meta {
      margin-top: 10px;
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 1.55;
    }
    .step-list { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
    .substep-head {
      margin: 14px 0 2px; padding: 0 2px;
      font-size: 12px; font-weight: 800; letter-spacing: .4px;
      color: var(--amber); text-transform: none;
    }
    .substep-head:first-child { margin-top: 0; }
    /* Backlog items captured per screen — shown as cards under the screen (right panel) */
    .backlog-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-content: start; }
    .bk-card {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
      padding: 13px 15px; border-radius: 12px;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.10);
      border-left-width: 3px;
      font-size: 14px; line-height: 1.5; color: #e7ebf2;
    }
    .bk-card .bk-text { flex: 1; }
    .bk-pill {
      flex: none; font-size: 11px; font-weight: 800; letter-spacing: .3px;
      padding: 3px 10px; border-radius: 999px; margin-top: 1px;
      max-width: 118px; text-align: center; line-height: 1.3;
    }
    .bk-card.bk-built { border-left-color: #2fbf71; }
    .bk-card.bk-built .bk-pill { background: rgba(47,191,113,.16); color: #46d488; }
    .bk-card.bk-uat { border-left-color: #9aa3b2; opacity: .92; }
    .bk-card.bk-uat .bk-pill { background: rgba(154,163,178,.18); color: #b3bbc9; }
    .step-item {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.045);
      color: var(--ink);
      padding: 13px 14px;
      text-align: left;
      font: inherit;
      cursor: pointer;
      transition: .22s var(--ease);
    }
    .step-item:hover, .step-item:focus-visible {
      outline: none;
      border-color: rgba(255,194,102,.45);
      background: rgba(255,194,102,.09);
    }
    .step-item.active {
      border-color: rgba(255,194,102,.72);
      background: linear-gradient(135deg, rgba(245,166,35,.18), rgba(245,166,35,.055));
      box-shadow: 0 14px 32px -28px rgba(245,166,35,.8);
    }
    .step-item small {
      display: block;
      color: var(--amber);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .step-item strong {
      display: block;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.35;
    }
    .step-item span {
      display: block;
      margin-top: 5px;
      color: var(--ink-soft);
      font-size: 12.5px;
      line-height: 1.45;
    }
    .shot-frame {
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(0,0,0,.26);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(14px,2vw,22px);
      overflow: hidden;
    }
    /* Backlog tab: match the UX-feedback stage size — full width, 16:9. */
    .shot-frame:not(.is-feedback) {
      width: 100%;
      aspect-ratio: 16 / 9;
    }
    .shot-frame img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 12px;
      background: #fff;
      display: block;
      box-shadow: 0 18px 52px -28px rgba(0,0,0,.85);
    }
    .shot-frame img.is-error { display: none; }
    .shot-frame img.is-error + .shot-missing { display: flex; }
    /* No-screenshot backlog view: cards fill the frame */
    .shot-frame.backlog-fill { display: block; overflow-y: auto; padding: clamp(18px,2.4vw,26px); }
    .backlog-fill-inner { display: flex; flex-direction: column; gap: 12px; }
    .bk-screen-title { font-size: 13px; font-weight: 800; letter-spacing: .3px; color: var(--amber); margin-bottom: 2px; }
    .shot-frame.is-feedback {
      display: block;
      align-items: stretch;
      justify-content: stretch;
      height: auto;
      overflow: visible;
    }
    .shot-missing {
      width: 100%;
      min-height: 320px;
      border: 1px dashed rgba(255,255,255,.22);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
      padding: 28px;
      color: var(--ink-soft);
      background: radial-gradient(circle at 50% 20%, rgba(94,158,255,.16), transparent 42%), rgba(255,255,255,.035);
    }
    img + .shot-missing { display: none; }
    .shot-missing strong { color: var(--ink); font-size: 20px; letter-spacing: -.01em; }
    .shot-caption {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,.055);
      color: var(--ink-soft);
      padding: 14px 16px;
      font-size: 14px;
      line-height: 1.55;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .shot-caption[hidden] { display: none; }
    .shot-caption b { color: var(--ink); }
    .feedback-board {
      width: 100%;
      min-height: 320px;
      display: grid;
      gap: 14px;
      align-content: start;
    }
    .feedback-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,.055);
      padding: 12px 14px;
      color: var(--ink-soft);
      font-size: 13px;
      line-height: 1.4;
    }
    .reset-compare {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.065);
      color: var(--ink);
      padding: 0 12px;
      font: inherit;
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
    }
    .reset-compare svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .feedback-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .annotation-toggle {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.055);
      color: var(--ink);
      padding: 0 11px;
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
      cursor: pointer;
    }
    .annotation-toggle input {
      width: 14px;
      height: 14px;
      accent-color: var(--blue);
      cursor: pointer;
    }
    .figma-comments-cta {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      border: 1px solid rgba(255,194,102,.48);
      border-radius: 12px;
      background: rgba(245,166,35,.12);
      color: var(--amber);
      padding: 0 12px;
      font-size: 12px;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
      transition: .2s var(--ease);
    }
    .figma-comments-cta:hover, .figma-comments-cta:focus-visible {
      outline: none;
      border-color: rgba(255,194,102,.78);
      color: var(--ink);
      transform: translateY(-1px);
    }
    .ux-compare-stage {
      --pos: 50%;
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      background: rgba(0,0,0,.34);
      cursor: ew-resize;
      user-select: none;
      touch-action: none;
    }
    /* Backlog-tab compare slider (two views of the same screen, no before/after labels). */
    .shot-frame .flow-compare { border: 0; background: transparent; box-shadow: 0 18px 52px -28px rgba(0,0,0,.85); }
    .ux-compare-stage .layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    .ux-compare-stage .after-layer {
      clip-path: inset(0 calc(100% - var(--pos)) 0 0);
      z-index: 2;
      will-change: clip-path;
    }
    .ux-compare-stage .before-layer { z-index: 1; }
    .ux-compare-image {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      pointer-events: none;
      background: #f8fafc;
    }
    .ux-compare-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 18px 44px rgba(0,0,0,.18);
    }
    .compare-chip {
      position: absolute;
      z-index: 6;
      left: var(--chip-x);
      top: var(--chip-y);
      display: inline-grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border: 2px solid rgba(255,255,255,.72);
      border-radius: 999px;
      background: rgba(78,88,108,.86);
      color: rgba(255,255,255,.9);
      font-size: 12px;
      font-weight: 850;
      line-height: 1;
      box-shadow: 0 10px 24px rgba(0,0,0,.3);
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
      transition: opacity .18s var(--ease), background .18s var(--ease), box-shadow .18s var(--ease), transform .18s var(--ease);
    }
    .ux-compare-stage.show-annotations .compare-chip { opacity: 1; }
    .ux-compare-stage.show-annotations.active-annotation-1 .compare-chip[data-feedback-index="1"],
    .ux-compare-stage.show-annotations.active-annotation-2 .compare-chip[data-feedback-index="2"],
    .ux-compare-stage.show-annotations.active-annotation-3 .compare-chip[data-feedback-index="3"],
    .ux-compare-stage.show-annotations.active-annotation-4 .compare-chip[data-feedback-index="4"] {
      background: #1683ff;
      color: #fff;
      box-shadow: 0 0 0 4px rgba(22,131,255,.22), 0 14px 30px rgba(0,0,0,.32);
      transform: translate(-50%, -50%) scale(1.12);
    }
    .ux-compare-card {
      position: absolute;
      inset: 20px;
      display: grid;
      align-content: center;
      gap: 18px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 18px;
      padding: clamp(22px,3vw,42px);
      background:
        radial-gradient(circle at 18% 18%, rgba(94,158,255,.18), transparent 38%),
        linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.028));
    }
    .after-layer .ux-compare-card {
      background:
        radial-gradient(circle at 25% 18%, rgba(46,101,246,.28), transparent 34%),
        linear-gradient(135deg, rgba(94,158,255,.18), rgba(255,194,102,.045));
    }
    .ux-compare-card small {
      color: var(--amber);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .ux-compare-card strong {
      color: var(--ink);
      font-size: clamp(24px,3vw,38px);
      line-height: 1.06;
      letter-spacing: -.02em;
    }
    .ux-compare-card span {
      max-width: 58ch;
      color: var(--ink-soft);
      font-size: clamp(15px,1.4vw,19px);
      line-height: 1.5;
    }
    .compare-label {
      position: absolute;
      top: 18px;
      z-index: 4;
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 18px;
      border-radius: 999px;
      color: #fff;
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .12em;
      text-transform: uppercase;

    function esc(value) {
      return String(value ?? "").replace(/[&<>"]/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;"
      }[char]));

    function flowForArea(area) {
      const mapped = SCREENSHOT_FLOWS[area.id];
      if (mapped) return mapped;
      return {
        meta: area.flowMeta || "No screenshot flow has been mapped for this item yet. Showing lifecycle detail as fallback.",

    function setCompare(stage, value) {
      if (!stage) return;
      const v = Math.max(0, Math.min(100, Number(value)));
      stage.style.setProperty("--pos", `${v}%`);
      stage.dataset.slider = String(v);
    }

    function initCompareStage(stage) {
      if (!stage) return;
      setCompare(stage, stage.dataset.slider || 50);
      let dragging = false;
      const move = clientX => {
        const rect = stage.getBoundingClientRect();
        setCompare(stage, ((clientX - rect.left) / rect.width) * 100);
      };
      stage.addEventListener("pointerdown", event => {
        dragging = true;
        stage.setPointerCapture(event.pointerId);
        move(event.clientX);
      });
      stage.addEventListener("pointermove", event => {
        if (!dragging && event.buttons !== 1) return;
        move(event.clientX);
      });
      stage.addEventListener("pointerup", event => {
        dragging = false;
        try { stage.releasePointerCapture(event.pointerId); } catch {}
      });
      stage.addEventListener("pointercancel", event => {
        dragging = false;
        try { stage.releasePointerCapture(event.pointerId); } catch {}
      });
      stage.addEventListener("dblclick", () => setCompare(stage, 50));
    }

    function renderPanelList() {
      const items = activePanel === "feedback" ? activeFlow?.feedbackItems : activeSteps;
      let lastSub = null;
      detailSteps.innerHTML = (items || []).map((item, index) => {
        // Group screens under their sub-step (A1.1, A1.2…) with a header, when defined.
        const header = (item.sub && item.sub !== lastSub)
          ? `<div class="substep-head">${esc(item.sub)}</div>` : "";
        lastSub = item.sub;
        const description = activePanel === "feedback" ? "" : `<span>${esc(item.desc)}</span>`;
        return header + `
          <button class="step-item${index === 0 ? " active" : ""}" type="button" data-index="${index}" aria-pressed="${index === 0 ? "true" : "false"}">
            <small>${esc(item.step)}</small>
            <strong>${esc(item.title)}</strong>
            ${description}
          </button>
        `;
      }).join("");
      detailSteps.querySelectorAll(".step-item").forEach(button => {
        button.addEventListener("click", () => {
          activeStepIndex = Number(button.dataset.index) || 0;
          renderActiveStep();
        });
      });
      renderActiveStep();
    }

    function setPanel(panel) {
      activePanel = panel;
      activeStepIndex = 0;
      detailTabs.querySelectorAll(".tab-btn").forEach(button => {
        button.classList.toggle("active", button.dataset.panel === panel);
      });
      renderPanelList();
    }

    function renderColumns() {
      flowcols.innerHTML = PHASES.map(phase => {
        const letter = phase === "Preparation" ? "A" : phase === "Programme" ? "B" : "C";
        const buttons = AREAS.filter(area => area.phase === phase).map((area, i) => `
          <button class="farea" type="button" data-id="${area.id}">
            <span class="fic fcode" aria-hidden="true">${letter}${i + 1}</span>
            <span class="fan">${area.title}</span>
            <span class="chev" aria-hidden="true"></span>
          </button>
        `).join("");
        return `<div class="glass fcol"><div class="fst">${phase}</div><div class="fareas">${buttons}</div></div>`;
      }).join("");

      flowcols.querySelectorAll(".farea").forEach(button => {
        button.addEventListener("click", () => openDetail(button.dataset.id, button));
      });
    }

    function openDetail(id, source) {
      const area = AREAS.find(item => item.id === id);
      if (!area) return;
      lastFocus = source || null;
      const flow = flowForArea(area);
      activeFlow = flow;
      activePanel = "flow";
      activeSteps = flow.steps;
      activeStepIndex = 0;
      detailPhase.textContent = area.phase;
      const areaLetter = area.phase === "Preparation" ? "A" : area.phase === "Programme" ? "B" : "C";
      const areaCode = areaLetter + (AREAS.filter(a => a.phase === area.phase).indexOf(area) + 1);
      detailTitle.textContent = areaCode + " · " + area.title;
      detailMeta.textContent = flow.meta;
      if (flow.feedback) {
        detailTabs.hidden = false;
      } else {
        detailTabs.hidden = true;
      }
      detailTabs.querySelectorAll(".tab-btn").forEach(button => {
        button.classList.toggle("active", button.dataset.panel === "flow");
      });
      renderPanelList();
      document.body.classList.add("detail-open");
      detail.setAttribute("aria-hidden", "false");
      back.focus();
    }

    function closeDetail() {
      document.body.classList.remove("detail-open");
      detail.setAttribute("aria-hidden", "true");
      if (lastFocus) lastFocus.focus();
    }

    back.addEventListener("click", closeDetail);
    detailTabs.querySelectorAll(".tab-btn").forEach(button => {
      button.addEventListener("click", () => setPanel(button.dataset.panel));
    });
    detail.addEventListener("click", event => {
      if (event.target === detail) closeDetail();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && document.body.classList.contains("detail-open")) closeDetail();
    });

    renderColumns();
